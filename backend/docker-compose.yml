version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cognitive-alarm-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alarm_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alarm_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: cognitive-alarm-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/alarm_platform
      JWT_SECRET_KEY: 94c8e7bd2cb84db65ba48a73507df13b2de9a13a8cb7e42f9b7c84439c363d6b
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
